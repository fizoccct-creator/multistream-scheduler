<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Multistream Scheduler</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23e5484d'/></svg>">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login-wrap">
    <form id="login" class="card login-card">
      <div class="brand"><span class="dot" aria-hidden="true"></span>Multistream Scheduler</div>
      <label class="field">
        <span class="label">Password</span>
        <input type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <p id="login-error" class="error" hidden></p>
      <button class="btn primary wide" type="submit">Sign in</button>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
